<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compact Pair Lexicon</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css");

:root{
  --accent:#6d6298;
  --accent-rgb:109,98,152;
  --bg:#74708f;
  --bg2:#b9bfd6;
  --ink:#292637;
  --paper:rgba(251,250,255,.86);
  --paper2:rgba(255,255,255,.7);
  --line:rgba(255,255,255,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  font-family:
    Pretendard,
    "Noto Sans KR",
    "Noto Sans CJK KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
  color:var(--ink);
  background:linear-gradient(145deg,var(--bg),var(--bg2));
}
button,input,textarea{font:inherit}
button,input,textarea,#capture{
  font-family:
    Pretendard,
    "Noto Sans KR",
    "Noto Sans CJK KR",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
}
button{cursor:pointer}

.app{
  display:grid;
  grid-template-columns:minmax(0,1fr) 500px;
  min-height:100vh;
}
.stage-wrap{
  padding:20px;
  overflow:auto;
}
.stage-scroll{
  min-width:900px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}
.preview-shell{
  position:relative;
  width:852px;
  min-height:1px;
}

#capture{
  position:relative;
  width:760px;
  transform:scale(1.12);
  transform-origin:top left;
  margin:0 auto;
  padding:18px;
  overflow:hidden;
  border-radius:30px;
  color:#fff;
  isolation:isolate;
  background:
    linear-gradient(rgba(44,41,67,.32),rgba(44,41,67,.32)),
    var(--bg-image,none),
    linear-gradient(145deg,var(--bg),var(--bg2));
  background-size:cover;
  background-position:center;
  box-shadow:0 28px 80px rgba(26,23,49,.26);
}
#capture::before{
  content:"";
  position:absolute;inset:0;z-index:-2;
  backdrop-filter:blur(var(--blur,5px));
}
#capture::after{
  content:"";
  position:absolute;inset:0;z-index:-1;
  background:rgba(24,22,42,var(--dim,.2));
}

.glass{
  border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.21),rgba(255,255,255,.1));
  backdrop-filter:blur(18px);
  box-shadow:0 10px 28px rgba(30,27,55,.12);
}

.topbar{
  height:46px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-radius:15px;
  font-size:10px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:900}
.brand-dot{width:8px;height:8px;border-radius:50%;background:#fff}
.topnav{display:flex;gap:16px;opacity:.7}
.mini-title{font-weight:800}

.main-layout{
  display:grid;
  grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);
  gap:10px;
  margin-top:10px;
  align-items:stretch;
}
.masthead{
  display:block;
  height:100%;
  min-height:0;
}
.main-art img,.main-art img,.theme-cover img{
  width:100%;height:100%;object-fit:cover;display:block;
}

.main-art{
  position:relative;
  height:calc(100% + 3px);
  min-height:0;
  aspect-ratio:auto;
  border-radius:20px;
  overflow:hidden;
  background:rgba(21,19,38,.32);
}
.main-art img{position:absolute;inset:0;object-position:50% 50%}
.main-shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(17,16,31,.05) 42%,rgba(17,16,31,.82));
}
.main-copy{
  position:absolute;
  left:22px;right:22px;bottom:24px;
}
.main-title{
  margin:5px 0 6px;
  font-size:25px;
  line-height:1;
  letter-spacing:-.04em;
}
.main-desc{
  margin:0;
  max-width:720px;
  font-size:10px;
  line-height:1.5;
  opacity:.8;
  white-space:pre-wrap;
}

.right-stack{
  display:grid;
  grid-template-rows:auto auto;
  gap:10px;
  align-content:start;
}

.music-strip{
  display:grid;
  grid-template-columns:104px minmax(0,1fr);
  gap:9px;
  margin:0;
  min-height:122px;
  padding:9px;
  border-radius:18px;
}
.theme-cover{
  width:104px;height:104px;
  align-self:center;
  border-radius:15px;
  overflow:hidden;
  background:rgba(20,18,36,.3);
}
.music-info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.music-main{
  margin:0 0 3px;
  font-size:14px;
  font-weight:850;
}
.music-artist{font-size:9px;opacity:.58}
.subsongs{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
  margin-top:5px;
  transform:translateY(7px);
}
.subsong{
  padding:5px 7px;
  border-radius:9px;
  background:rgba(255,255,255,.2);
  font-size:8px;
  line-height:1.35;
}

.dictionary{
  margin:0;
  padding:0;
  border:0 !important;
  border-radius:0;
  background:transparent !important;
  box-shadow:none !important;
  backdrop-filter:none !important;
}
.dictionary-head{
  display:block;
  padding:2px 1px 8px;
  border:0 !important;
  background:transparent;
  box-shadow:none;
}
.dictionary-label{
  font-size:10px;
  line-height:1;
  font-weight:900;
  letter-spacing:.16em;
  color:rgba(255,255,255,.82);
}

.lexicon-columns{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:8px;
  row-gap:8px;
  align-items:stretch;
  background:transparent;
  border:0 !important;
  outline:0 !important;
  box-shadow:none !important;
}
.entry{
  display:block;
  height:92px;
  padding:8px 9px;
  border-radius:13px;
  background:var(--paper);
  color:#302c41;
  border:0;
  box-shadow:none;
  break-inside:avoid;
  overflow:hidden;
}
.entry-word{
  margin:0 0 4px;
  font-size:13px;
  line-height:1.18;
  letter-spacing:-.015em;
}
.entry-reading{
  margin-left:5px;
  font-size:7px;
  letter-spacing:.1em;
  opacity:.42;
}
.entry-meaning{
  margin:0;
  height:58px;
  font-size:8.8px;
  line-height:1.38;
  white-space:pre-wrap;
  overflow:hidden;
}
.footer{
  display:flex;
  justify-content:space-between;
  padding:11px 6px 0;
  font-size:7px;
  letter-spacing:.11em;
  text-transform:uppercase;
  opacity:.52;
}

.editor{
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  padding:18px;
  background:#f5f3fa;
  border-left:1px solid #ded9e8;
  color:#2f2b39;
  box-shadow:-18px 0 60px rgba(32,27,51,.12);
}
.editor h1{font-size:24px;margin:3px 0 14px}
.editor-intro{font-size:12px;line-height:1.55;color:#706a79;margin:0 0 15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.btn{
  border:0;border-radius:12px;padding:11px;
  font-size:12px;font-weight:900;
  background:#e2ddec;color:#514a62;
}
.btn.primary{background:var(--accent);color:#fff}
.panel{
  margin-bottom:10px;
  border:1px solid #e2dde9;
  border-radius:16px;
  background:#fff;
  overflow:hidden;
}
.panel summary{
  list-style:none;
  padding:13px 14px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"＋";color:#9c96aa}
.panel[open] summary::after{content:"－"}
.panel-body{padding:0 16px 16px;display:grid;gap:10px}
label{display:grid;gap:5px;font-size:10px;font-weight:800;color:#7c7588}
input,textarea{
  width:100%;
  border:1px solid #ddd7e5;
  border-radius:10px;
  padding:10px 12px;
  background:#fbfafe;
  color:#302c39;
  font-size:13px;
  outline:none;
}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input[type=color]{height:38px;padding:4px}
input[type=range]{padding:0;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.entry-editor{
  padding:10px;
  border:1px solid #e6e1eb;
  border-radius:12px;
  background:#faf9fc;
  display:grid;
  gap:8px;
  margin-bottom:8px;
}
.small{
  border:0;
  border-radius:9px;
  padding:8px 9px;
  font-size:10px;
  font-weight:900;
  background:#ebe7f0;
  color:#625b70;
}
.remove{background:#f4e8ec;color:#a45269}

@media(max-width:1320px){
  .app{display:block}
  .editor{position:relative;height:auto;border-left:0;border-top:1px solid #ddd7e5}
  .stage-wrap{padding:12px}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage-wrap">
    <div class="stage-scroll">
      <div class="preview-shell" id="previewShell">
      <section id="capture">
        <header class="topbar glass">
          <div class="brand"><span class="brand-dot"></span><span id="brandText">Pair Lexicon</span></div>
          <nav class="topnav"><span>Archive</span><span>Dictionary</span><span>Music</span></nav>
          <div class="mini-title" id="miniTitle">자정의 시간</div>
        </header>

        <section class="main-layout">
          <div class="masthead">
            <article class="main-art glass">
              <img id="mainImg" alt="">
              <div class="main-shade"></div>
              <div class="main-copy">
                <div class="kicker" id="englishTitle">MIDNIGHT HOUR</div>
                <h1 class="main-title" id="pairTitle">자정의 시간</h1>
                <p class="main-desc" id="pairDesc">파각을 바라는 이데아에게, 불변을 바라는 피그말리온으로부터.</p>
              </div>
            </article>
          </div>

          <div class="right-stack">
            <section class="music-strip glass">
              <div class="theme-cover"><img id="musicCover" alt=""></div>
              <div class="music-info">
                <div class="music-main" id="pairSong">Pair Theme</div>
                <div class="music-artist" id="pairArtist">Artist</div>
                <div class="subsongs">
                  <div class="subsong" id="char1Song">이자헌 · Character Theme</div>
                  <div class="subsong" id="char2Song">정희솔 · Character Theme</div>
                </div>
              </div>
            </section>

            <section class="dictionary glass">
              <div class="dictionary-head">
                <div class="dictionary-label">PAIR DICTIONARY</div>
              </div>
              <div class="lexicon-columns" id="entryGrid"></div>
            </section>
          </div>
        </section>

        <footer class="footer">
          <span>Pair Lexicon · Made with our memories</span>
          <span id="creditText">ILLUST. @CREDIT</span>
        </footer>
      </section>
      </div>
    </div>
  </main>

  <aside class="editor">
    <h1>Compact Pair Lexicon</h1>
<div class="actions">
      <button class="btn primary" id="saveBtn">PNG 저장</button>
      <button class="btn" id="resetBtn">초기화</button>
    </div>

    <details class="panel" open>
      <summary>전체 디자인</summary>
      <div class="panel-body">
        <div class="two">
          <label>강조색<input type="color" id="accentInput" value="#6d6298"></label>
          <label>배경색<input type="color" id="bgInput" value="#74708f"></label>
        </div>
        <label>배경 이미지<input type="file" id="bgUpload" accept="image/*"></label>
        <label>배경 흐림<input type="range" id="blurInput" min="0" max="18" value="5"></label>
        <label>배경 어둡기<input type="range" id="dimInput" min="0" max="70" value="20"></label>
        <label>브랜드 문구<input id="brandInput" value="Pair Lexicon"></label>
        <label>크레딧<input id="creditInput" value="ILLUST. @CREDIT"></label>
      </div>
    </details>

    <details class="panel" open>
      <summary>페어 정보 및 메인 이미지</summary>
      <div class="panel-body">
        <label>영문 제목<input id="englishTitleInput" value="MIDNIGHT HOUR"></label>
        <label>페어 이름<input id="pairTitleInput" value="자정의 시간"></label>
        <label>한 줄 소개<textarea id="pairDescInput">파각을 바라는 이데아에게, 불변을 바라는 피그말리온으로부터.</textarea></label>
        <label>메인 일러스트<input type="file" id="mainUpload" accept="image/*"></label>
        <div class="two">
          <label>일러스트 좌우 위치
            <input type="range" id="mainPosX" min="0" max="100" value="50">
          </label>
          <label>일러스트 상하 위치
            <input type="range" id="mainPosY" min="0" max="100" value="50">
          </label>
        </div>
      </div>
    </details>

    <details class="panel">
      <summary>테마곡</summary>
      <div class="panel-body">
        <label>커버 이미지<input type="file" id="musicUpload" accept="image/*"></label>
        <div class="two">
          <label>페어 테마곡<input id="pairSongInput" value="Pair Theme"></label>
          <label>아티스트<input id="pairArtistInput" value="Artist"></label>
        </div>
        <label>왼쪽 인물 테마곡<input id="char1SongInput" value="이자헌 · Character Theme"></label>
        <label>오른쪽 인물 테마곡<input id="char2SongInput" value="정희솔 · Character Theme"></label>
      </div>
    </details>

    <details class="panel" open>
      <summary>사전 설정</summary>
      <div class="panel-body">
        <div id="entryEditors"></div>
        <button class="small" id="addEntryBtn">＋ 단어 추가</button>
      </div>
    </details>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const capture=$("#capture");

const previewShell=$("#previewShell");
const PREVIEW_SCALE=1.12;

function syncPreviewSize(){
  if(!previewShell)return;
  previewShell.style.width=(capture.offsetWidth*PREVIEW_SCALE)+"px";
  previewShell.style.height=(capture.offsetHeight*PREVIEW_SCALE)+"px";
}

if("ResizeObserver" in window){
  new ResizeObserver(syncPreviewSize).observe(capture);
}else{
  window.addEventListener("resize",syncPreviewSize);
}

const state={entries:[
  {word:"자정",reading:"MIDNIGHT",meaning:"두 세계의 경계가 가장 얇아지는 시간. 정희솔은 불규칙한 자정마다 이곳으로 넘어오며, 이 순간은 두 사람이 다시 만날 수 있는 약속이자 언제든 헤어질 수 있다는 불안이 된다."},
  {word:"파각",reading:"BREAKING",meaning:"완전하고 고정된 이야기의 틀을 깨뜨리는 행위. 독자와 등장인물이라는 정해진 관계에서 벗어나, 서로를 한 사람의 인간으로 바라보기 위해 필요한 선택을 뜻한다."},
  {word:"이데아",reading:"IDEA",meaning:"변하지 않는 본질과 이상적인 원형. 이자헌은 자신이 정해진 이야기 속 존재라는 사실을 넘어 스스로를 증명하려 하고, 정희솔은 자신이 사랑했던 이상과 눈앞의 인간 사이에서 새로운 답을 찾는다."},
  {word:"현상",reading:"PHENOMENON",meaning:"관측되고 기록되어 존재가 증명되는 것. 정희솔은 사진과 문서, 타인의 기억에서 사라지지만 이자헌만은 그녀를 기억한다. 그래서 그의 기억은 그녀가 이 세계에 있었다는 유일한 현상이 된다."},
  {word:"등장인물",reading:"CHARACTER",meaning:"누군가의 이야기 속에서 정해진 역할을 수행하는 존재. 이자헌은 정희솔에게 자신이 단지 사랑받는 등장인물인지, 아니면 선택과 감정을 가진 인간인지 묻고 싶어 한다."},
  {word:"독자",reading:"READER",meaning:"이야기를 읽고 결말까지 기억하는 사람. 정희솔은 세계의 바깥을 알고 있다는 우위를 지녔지만, 이자헌을 실제로 마주한 뒤에는 그를 해석하는 사람이 아니라 함께 변화하는 사람이 된다."}
]};

function esc(v=""){
  return v.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function bind(a,b){$(a).addEventListener("input",e=>$(b).textContent=e.target.value)}
[
["#brandInput","#brandText"],["#creditInput","#creditText"],
["#englishTitleInput","#englishTitle"],["#pairTitleInput","#pairTitle"],["#pairTitleInput","#miniTitle"],
["#pairDescInput","#pairDesc"],["#pairSongInput","#pairSong"],["#pairArtistInput","#pairArtist"],
["#char1SongInput","#char1Song"],["#char2SongInput","#char2Song"]
].forEach(x=>bind(...x));

function rgb(hex){
  const h=hex.replace("#","");
  const n=parseInt(h,16);
  return[(n>>16)&255,(n>>8)&255,n&255];
}
$("#accentInput").addEventListener("input",e=>{
  const c=e.target.value;
  document.documentElement.style.setProperty("--accent",c);
  document.documentElement.style.setProperty("--accent-rgb",rgb(c).join(","));
});
$("#bgInput").addEventListener("input",e=>{
  document.documentElement.style.setProperty("--bg",e.target.value);
  document.documentElement.style.setProperty("--bg2",e.target.value+"cc");
});
$("#blurInput").addEventListener("input",e=>capture.style.setProperty("--blur",e.target.value+"px"));
$("#dimInput").addEventListener("input",e=>capture.style.setProperty("--dim",e.target.value/100));

function load(input,img,bg=false){
  $(input).addEventListener("change",e=>{
    const f=e.target.files?.[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>bg
      ?capture.style.setProperty("--bg-image",`url("${r.result}")`)
      :$(img).src=r.result;
    r.readAsDataURL(f);
  });
}
load("#bgUpload",null,true);
load("#mainUpload","#mainImg");
load("#musicUpload","#musicCover");

const mainImg=$("#mainImg");
const mainPosX=$("#mainPosX");
const mainPosY=$("#mainPosY");

function updateMainImagePosition(){
  mainImg.style.objectPosition=`${mainPosX.value}% ${mainPosY.value}%`;
}
mainPosX.addEventListener("input",updateMainImagePosition);
mainPosY.addEventListener("input",updateMainImagePosition);
updateMainImagePosition();


function entryCard(x,i){
  return `<article class="entry">
    <div>
      <h3 class="entry-word">${esc(x.word)} <span class="entry-reading">${esc(x.reading)}</span></h3>
      <p class="entry-meaning">${esc(x.meaning)}</p>
    </div>
  </article>`;
}

function fitMeanings(){
  document.querySelectorAll(".entry-meaning").forEach(el=>{
    let size=8.8;
    el.style.fontSize=size+"px";
    while(el.scrollHeight>el.clientHeight && size>7){
      size-=0.2;
      el.style.fontSize=size+"px";
    }
  });
}

function renderLists(){
  $("#entryGrid").innerHTML=state.entries.map((x,i)=>entryCard(x,i)).join("");
  requestAnimationFrame(()=>{
    fitMeanings();
    syncPreviewSize();
  });
}
function renderEditors(){
  $("#entryEditors").innerHTML=state.entries.map((x,i)=>`
    <div class="entry-editor">
      <div class="two">
        <label>단어<input data-i="${i}" data-k="word" value="${esc(x.word)}"></label>
        <label>영문/독음<input data-i="${i}" data-k="reading" value="${esc(x.reading)}"></label>
      </div>
      <label>뜻<textarea data-i="${i}" data-k="meaning">${esc(x.meaning)}</textarea></label>
      <button class="small remove" data-remove="${i}">삭제</button>
    </div>`).join("");
}
$("#entryEditors").addEventListener("input",e=>{
  const i=e.target.dataset.i,k=e.target.dataset.k;
  if(i===undefined||!k)return;
  state.entries[+i][k]=e.target.value;
  renderLists();
});
$("#entryEditors").addEventListener("click",e=>{
  const i=e.target.dataset.remove;
  if(i===undefined)return;
  state.entries.splice(+i,1);
  renderLists();
  renderEditors();
});
$("#addEntryBtn").addEventListener("click",()=>{
  state.entries.push({word:"새 단어",reading:"KEYWORD",meaning:"이 단어가 두 사람의 세계에서 지니는 의미를 적어 주세요."});
  renderLists();
  renderEditors();
});


async function waitForCaptureFonts(){
  if(!document.fonts)return;

  const sampleText=(capture.innerText||"한자 漢字 韓國語 日本語 中文").trim();
  const weights=[400,500,600,700,800,900];

  await Promise.allSettled(
    weights.map(weight=>
      document.fonts.load(`${weight} 16px "Noto Sans KR"`,sampleText)
    )
  );

  await document.fonts.ready;

  // 폰트 적용 후 레이아웃과 캔버스가 다시 그려질 시간을 확보
  await new Promise(resolve=>{
    requestAnimationFrame(()=>{
      requestAnimationFrame(resolve);
    });
  });
}

$("#saveBtn").addEventListener("click",async()=>{
  const b=$("#saveBtn"),old=b.textContent;
  b.textContent="저장 중…"; b.disabled=true;
  const originalTransform=capture.style.transform;
  try{
    await waitForCaptureFonts();
    capture.style.transform="none";
    await new Promise(resolve=>requestAnimationFrame(resolve));
    const canvas=await html2canvas(capture,{
      scale:2,
      useCORS:true,
      allowTaint:true,
      backgroundColor:null,
      logging:false,
      windowWidth:760,
      onclone:clonedDoc=>{
        const clonedCapture=clonedDoc.querySelector("#capture");
        if(clonedCapture){
          clonedCapture.style.fontFamily='Pretendard, "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
        }
      }
    });
    const a=document.createElement("a");
    a.download=($("#pairTitleInput").value||"pair-lexicon").replace(/[\\/:*?"<>|]/g,"_")+"_compact_lexicon.png";
    a.href=canvas.toDataURL("image/png");
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){
    alert("저장 중 오류가 발생했어. 외부 이미지 대신 직접 업로드한 이미지를 사용해 봐.");
    console.error(e);
  }finally{
    capture.style.transform=originalTransform;
    syncPreviewSize();
    b.textContent=old;b.disabled=false;
  }
});
$("#resetBtn").addEventListener("click",()=>{if(confirm("초기화할까?"))location.reload()});

renderLists();
renderEditors();
requestAnimationFrame(syncPreviewSize);
</script>
